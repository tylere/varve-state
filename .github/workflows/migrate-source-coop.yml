name: Migrate source.coop folders (one-off)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "copy, then delete once the copies are verified"
        type: choice
        options: [copy, delete]

permissions:
  contents: read
  id-token: write   # lets the job sign in to source.coop as a service account

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      - name: Sign in to source.coop
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.SOURCE_COOP_SERVICE_ACCOUNT }}:role/FullAccess
          audience: https://data.source.coop
          sts-endpoint: https://data.source.coop/.sts
          aws-region: us-west-2

      - name: Migrate
        env:
          PHASE: ${{ inputs.phase }}
        run: uv run --no-project --with boto3 python .github/scripts/migrate_source_coop.py "$PHASE"
